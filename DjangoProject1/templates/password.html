{% extends "base.html" %}
{% load static %}

{% block title %}Подтверждения{% endblock %}

{% block style %}
    <link rel="stylesheet" href="{% static 'style/password.css' %}">
{% endblock %}

{% block content %}
    <main class="password-card">
        <h1>Подтвердите удаление</h1>
        <form method="post">
            {% csrf_token %}
            <label for="input-password">Введите пароль</label>
            <input id="input-password" type="password" name="input-password" required autocomplete="current-password">
            <button class="submit" type="submit">Отправить</button>
        </form>
        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <a class="back" href="{% url 'index' %}">Назад</a>
    </main>
{% endblock %}
